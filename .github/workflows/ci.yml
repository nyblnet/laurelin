name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.6
      - run: ruff check laurelin tests bench
      # The floor advertised in pyproject. vermin reads the AST, so it catches
      # syntax we could only run on a newer interpreter — the matrix below
      # catches everything else.
      #
      # 1.8.0, not 1.6.0: vermin 1.6.0 calls `ast.Str`, which was removed in
      # Python 3.12, so it dies with `AttributeError: module 'ast' has no
      # attribute 'Str'` on the very interpreter this job pins. Measured by
      # running both locally — 1.6.0 tracebacks, 1.8.0 reports "Minimum
      # required versions: 3.9" and exits 0. This job had never been executed,
      # so the crash sat here unseen: a linter that cannot start is
      # indistinguishable from one that finds nothing until you read the log.
      - run: pip install vermin==1.8.0
      - run: vermin --no-parse-comments --target=3.11- --violations laurelin/

  # ---------------------------------------------------------------- tests
  #
  # The matrix exists to hold `requires-python = ">=3.11"` honest: the floor
  # is a promise to anyone who pip-installs, and until this ran it had never
  # been executed on anything but the development interpreter.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: laurelin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # xmlsec1 is a runtime binary for the SAML tests, not a Python package.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1

      - name: Install
        run: pip install -e '.[dev,postgres,saml,mcp,engines,scheduler,metrics,iceberg,clickhouse,starrocks]'

      # Every optional extra is installed above, so this run exercises the
      # SAML, MCP, Flight SQL, croniter and prometheus paths rather than
      # silently skipping them.
      - name: Test (SQLite + PostgreSQL)
        env:
          LAURELIN_TEST_POSTGRES: postgresql://postgres:test@127.0.0.1:5432/laurelin
        run: pytest -q -p no:warnings -rs --durations=10

      # tests/test_ci_guards.py fails the run if the PostgreSQL suite silently
      # skipped — a skip is invisible in a green run, which is exactly how a
      # whole dialect stops being tested without anyone noticing.

  # ---------------------------------------------------------------- packaging
  #
  # Building the wheel is not the same as it working. The UI is a 700 KB data
  # file inside the package; if package-data ever regresses, every test still
  # passes and the served app is a 404.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build && python -m build

      - name: The wheel must contain the prebuilt UI
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          if not any(n.endswith("laurelin/ui/static/index.html") for n in names):
              sys.exit("::error::wheel is missing laurelin/ui/static/index.html")
          print(f"{whl}: {len(names)} files, UI present")
          PY

      - name: Install into a clean environment and serve
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/laurelin --help > /dev/null
          /tmp/clean/bin/laurelin init /tmp/ws --name smoke
          /tmp/clean/bin/laurelin serve --workspace /tmp/ws --no-auth --port 8799 &
          for i in $(seq 1 40); do
            curl -sf localhost:8799/health > /dev/null && break || sleep 0.5
          done
          curl -sf localhost:8799/health
          curl -sf localhost:8799/health/ready
          # The UI must be served, not merely packaged.
          curl -sf localhost:8799/ | grep -qi '<title' \
            || { echo "::error::UI did not render"; exit 1; }
          curl -sf localhost:8799/api/v1/datasets

  # ---------------------------------------------------------------- starrocks
  #
  # Opt-in, not part of the matrix. The allin1 image is 3.18 GB, and a pull per
  # matrix entry would dominate the cost of the whole workflow for a backend
  # whose dialect unit tests already run everywhere. `workflow_dispatch` (or a
  # `starrocks` label on a PR) is what turns it on.
  #
  # Locally this suite runs against a container started the same way, and cold
  # start to a live BE measured ~15 s under rootless podman — no --privileged,
  # no sysctl changes. **This job itself has not been executed on GitHub
  # Actions**; it is written from the local container's behaviour, so treat the
  # first run as the verification.
  starrocks:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'starrocks')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,starrocks]'

      - name: Start StarRocks
        run: |
          docker run -d --name laurelin-sr \
            -p 9030:9030 -p 8030:8030 -p 8040:8040 \
            starrocks/allin1-ubuntu:latest
          # The FE accepts connections before the BE has registered, and a
          # query against a table with no live backend fails in a way that
          # looks like a Laurelin bug. Wait for a query to succeed, not a port.
          for i in $(seq 1 120); do
            docker exec laurelin-sr mysql -h127.0.0.1 -P9030 -uroot \
              -e "CREATE DATABASE IF NOT EXISTS lau" && break || sleep 5
          done

      # Three things learned by running this locally, each of which broke the
      # suite before it was understood:
      #
      # 1. `root` MUST stay passwordless. The image's own supervisor uses that
      #    account to register the BE with the FE; setting a password makes it
      #    log "Password error, stop retrying!" and shut the container down
      #    ~15 s later, after which every StarRocks test fails with a
      #    connection reset that looks nothing like the actual cause.
      # 2. So the suite connects as a SEPARATE password-bearing user. That is
      #    not incidental: test_the_dsn_never_reaches_a_viewer asserts the
      #    credential is redacted out of viewer-readable API responses, and a
      #    passwordless DSN gives it nothing to assert against — it fails.
      # 3. `GRANT ALL ON *.*` is NOT sufficient on StarRocks 3.x+. Without
      #    db_admin and DEFAULT ROLE ALL, DDL fails with "Current role(s):
      #    NONE" and every test that creates a table errors.
      - name: Create the test user
        run: |
          docker exec laurelin-sr mysql -h127.0.0.1 -P9030 -uroot -e "
            CREATE USER IF NOT EXISTS 'laurelin'@'%' IDENTIFIED BY 'srsecret';
            GRANT db_admin TO USER 'laurelin'@'%';
            GRANT ALL ON ALL DATABASES TO USER 'laurelin'@'%';
            GRANT ALL ON ALL TABLES IN ALL DATABASES TO USER 'laurelin'@'%';
            ALTER USER 'laurelin'@'%' DEFAULT ROLE ALL;
          "

      - name: Test
        env:
          LAURELIN_TEST_STARROCKS: starrocks://laurelin:srsecret@127.0.0.1:9030/lau
        run: pytest -q -p no:warnings -rs tests/test_starrocks.py
          tests/test_starrocks_governance.py tests/test_dialects.py
          tests/test_text_agreement.py tests/test_ci_guards.py

  # ---------------------------------------------------------------- docs
  #
  # The tutorials are the first thing a newcomer reads and the last thing
  # anyone re-checks. Running them is what stops a documented command from
  # quietly outliving the code it documents.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,scheduler]'
      - name: The tutorials must still work
        run: pytest -q -p no:warnings tests/test_tutorials.py

  # ---------------------------------------------------------------- benchmarks
  #
  # docs/SCALE.md publishes measured numbers. Without a gate they are a
  # snapshot that rots silently — which has already happened twice. These
  # thresholds are deliberately loose: a shared CI runner is noisy, so this
  # catches an order-of-magnitude regression (an accidental full-table scan),
  # not a 20% drift.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Guard the published scaling claims
        run: python bench/regression.py
