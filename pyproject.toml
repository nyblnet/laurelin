[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laurelin"
version = "0.1.0"
description = "An open, ontology-driven data platform. Open formats, open APIs, no lock-in."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Laurelin contributors" }]
keywords = ["data-platform", "ontology", "pipelines", "lineage", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
    "pyarrow>=15",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Multi-workspace / production control plane on Postgres instead of SQLite.
postgres = ["psycopg[binary]>=3.1"]
# SAML 2.0 SSO (needs the xmlsec1 system binary at runtime).
saml = ["pysaml2>=7.5"]
# MCP server: expose the workspace to AI agents (laurelin mcp).
mcp = ["mcp>=1.0"]

[project.scripts]
laurelin = "laurelin.cli:main"

[project.urls]
Homepage = "https://github.com/laurelin-data/laurelin"

[tool.setuptools.packages.find]
include = ["laurelin*"]

[tool.setuptools.package-data]
"laurelin.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
