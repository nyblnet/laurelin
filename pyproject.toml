[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laurelin"
version = "0.1.0"
description = "An open, ontology-driven data platform. Open formats, open APIs, no lock-in."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Laurelin contributors" }]
keywords = ["data-platform", "ontology", "pipelines", "lineage", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
    "pyarrow>=15",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Multi-workspace / production control plane on Postgres instead of SQLite.
postgres = ["psycopg[binary]>=3.1"]
# SAML 2.0 SSO (needs the xmlsec1 system binary at runtime).
saml = ["pysaml2>=7.5"]
# MCP server: expose the workspace to AI agents (laurelin mcp).
mcp = ["mcp>=1.0"]
# Delegated compute: submit queries to a Flight SQL engine (Trino, Dremio,
# Databricks, …) and store the reduced result. Laurelin runs no cluster.
engines = ["adbc-driver-manager>=1.0", "adbc-driver-flightsql>=1.0"]
# Cron scheduling (on-upstream triggers need no extra dependency).
scheduler = ["croniter>=2.0"]
# Apache Iceberg-backed datasets: writable and versioned by Laurelin, and
# readable by Spark/Trino/Snowflake/DuckDB without it.
iceberg = ["pyiceberg[sql-sqlite]>=0.10"]
# Prometheus /metrics. Without it the endpoint 501s and every metric
# is a no-op, so instrumentation costs nothing when unused.
metrics = ["prometheus-client>=0.20"]

[project.scripts]
laurelin = "laurelin.cli:main"

[project.urls]
Homepage = "https://github.com/laurelin-data/laurelin"

[tool.setuptools.packages.find]
include = ["laurelin*"]

[tool.setuptools.package-data]
"laurelin.ui" = ["static/*"]

[tool.ruff]
# The advertised floor in requires-python. Keeping these in step means ruff
# rejects syntax that would only run on a newer interpreter than we promise.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Deliberately close to ruff's defaults (pyflakes + pycodestyle errors) plus
# import sorting. Not enabled yet, with reasons rather than silence:
#   UP  — 271 sites, almost all Optional[X] -> X | None. Pure churn on 3.11.
#   B   — worth doing; B904 (`raise ... from`) needs a per-site judgment about
#         whether the cause is safe to surface, so it is its own change.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument(...) and fastapi.File(...) in parameter defaults are the
# frameworks' required idiom, not the mutable-default bug B008 describes.
"laurelin/cli.py" = ["B008"]
"laurelin/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
